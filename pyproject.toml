[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerostack"
version = "0.1.0"
description = "A zero cost, self-hostable AI architecture baseline for small and midsize business applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  # query_points was introduced in 1.10; 1.9 exposes only the older search API,
# so retrieval would fail with AttributeError against the older floor.
  "qdrant-client>=1.10",
  "duckdb>=0.10",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Each extra is additive. None of them are required for the reference demo to run.
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
crewai = ["crewai>=0.51"]
embeddings = ["sentence-transformers>=2.7"]
chroma = ["chromadb>=0.5"]
ui = ["streamlit>=1.35"]
observability = ["arize-phoenix-otel>=0.6", "opentelemetry-sdk>=1.25"]
dev = ["pytest>=8.1", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
zerostack = "zerostack.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer's documented idiom is to call typer.Argument/typer.Option in the default,
# so B008 is a false positive for the CLI module.
"src/zerostack/cli.py" = ["B008"]
# FastAPI's documented idiom is Depends() in the parameter default, so B008 is a
# false positive for the API module in exactly the same way.
"src/zerostack/api/main.py" = ["B008"]
